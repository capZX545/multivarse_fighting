name: Build (Desktop + Android)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller multivarse.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with: { name: MultivarseFighting-windows, path: dist/MultivarseFighting.exe }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller multivarse.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with: { name: MultivarseFighting-linux, path: dist/MultivarseFighting }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      - run: pip install buildozer cython==0.29.36
      - name: Build APK
        run: buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with: { name: MultivarseFighting-android, path: bin/*.apk }

  release:
    needs: [windows, linux, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/MultivarseFighting-windows/*
            out/MultivarseFighting-linux/*
            out/MultivarseFighting-android/*
